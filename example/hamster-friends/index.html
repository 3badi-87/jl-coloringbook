<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hammy &amp; Friends</title>
  <script src="../../jl-coloringBook.js"></script>
  <style>
    body { margin: 0; padding: 16px; font-family: sans-serif; background: #fff8ec; text-align: center; }
    h1 { color: #c0702a; margin: 8px 0 4px; }
    p { margin: 0 0 16px; }
    .book { max-width: 640px; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>Hammy &amp; Friends</h1>
  <p>Pick a page, pick a color, and have fun! <a href="hammy-and-friends.pdf">Printable PDF</a></p>
  <div class="book">
    <jl-coloringbook maxbrushsize="40">
      <i color="rgba(232, 160, 90, 0.85)"></i>  <!-- hamster orange -->
      <i color="rgba(140, 90, 50, 0.85)"></i>   <!-- brown -->
      <i color="rgba(230, 50, 50, 0.85)"></i>   <!-- red -->
      <i color="rgba(255, 150, 200, 0.85)"></i> <!-- pink -->
      <i color="rgba(255, 220, 40, 0.85)"></i>  <!-- yellow -->
      <i color="rgba(80, 190, 80, 0.85)"></i>   <!-- green -->
      <i color="rgba(80, 170, 240, 0.85)"></i>  <!-- blue -->
      <i color="rgba(150, 90, 210, 0.85)"></i>  <!-- purple -->
      <i color="rgba(160, 160, 160, 0.85)"></i> <!-- gray -->
      <i color="rgba(255, 255, 255)"></i>       <!-- eraser (always last) -->
      <img src="./images/page-1.png" />
      <img src="./images/page-2.png" />
      <img src="./images/page-3.png" />
      <img src="./images/page-4.png" />
      <img src="./images/page-5.png" />
      <img src="./images/page-6.png" />
      <img src="./images/page-7.png" />
      <img src="./images/page-8.png" />
    </jl-coloringbook>
  </div>
</body>
</html>
